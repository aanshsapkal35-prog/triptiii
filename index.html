<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080911">
  <title>100 Things About You</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain"></div>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <div class="particles" id="particles"></div>

  <main class="stage">
    <div class="topline"><span> A LITTLE REMINDER </span><span class="top-dot">✦</span><span> JUST FOR YOU</span></div>

    <div class="orbit orbit-a"></div>
    <div class="orbit orbit-b"></div>

    <section class="words" aria-live="polite">
      <p class="eyebrow" id="eyebrow">01 / 100</p>
      <h1 id="mainText">You are so beautiful.</h1>
      <p class="subtext" id="subText">And I hope you never forget that.</p>
    </section>

    <div class="bottom">
      <div class="progress-meta"><span id="counter">01 — 100</span><span>MADE WITH LOVE</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
      <div class="controls">
        <button id="prev" aria-label="Previous">←</button>
        <button id="play" class="play">Ⅱ &nbsp; PAUSE</button>
        <button id="next" aria-label="Next">→</button>
      </div>
      <p class="hint">take your time · every word is meant for you</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
